pluginManagement {
    plugins {
        id 'org.springframework.boot' version '3.5.6'
        id 'io.spring.dependency-management' version '1.1.7'
        id 'com.google.cloud.tools.jib' version '3.4.5'
        id 'org.jetbrains.changelog' version '2.4.0'
        id 'net.researchgate.release' version '3.1.0'
        id 'org.sonarqube' version '7.0.0.6105'
    }
}

rootProject.name = 'tes-features'

include 'tes-features-component-tests'
include 'tes-features-data-generators'
include 'tes-features-deployment'
include 'tes-features-integrator'
include 'tes-features-model'
include 'tes-features-service'
