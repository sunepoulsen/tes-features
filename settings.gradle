pluginManagement {
    plugins {
        id 'org.springframework.boot' version '4.1.2'
        id 'io.spring.dependency-management' version '1.1.7'
        id 'com.google.cloud.tools.jib' version '3.5.4'
        id 'org.jetbrains.changelog' version '2.5.0'
        id 'net.researchgate.release' version '3.2.0'
        id 'org.sonarqube' version '7.6.0.18749'
        id 'io.gatling.gradle' version '3.16.1'
    }
}

rootProject.name = 'tes-features'

include 'tes-features-component-tests'
include 'tes-features-data-generators'
include 'tes-features-deployment'
include 'tes-features-integrator'
include 'tes-features-model'
include 'tes-features-service'
include 'tes-features-stress-tests'
