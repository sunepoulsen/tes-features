plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'com.google.cloud.tools.jib'
}

dependencies {
    // TES Features
    implementation project(':tes-features-model')

    // Tech Easy Solutions
    implementation 'dk.sunepoulsen.tes-foundation:tes-json:3.0.0-SNAPSHOT'
    implementation 'dk.sunepoulsen.tes-foundation:tes-data-jpa:3.0.0-SNAPSHOT'
    implementation 'dk.sunepoulsen.tes-foundation:tes-rest-models:3.0.0-SNAPSHOT'
    implementation 'dk.sunepoulsen.tes-foundation:tes-spring-boot-backend-logging:3.0.0-SNAPSHOT'
    implementation 'dk.sunepoulsen.tes-foundation:tes-spring-boot-rest-logic:3.0.0-SNAPSHOT'
    implementation 'dk.sunepoulsen.tes-foundation:tes-spring-boot-security:3.0.0-SNAPSHOT'

    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-tomcat'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.2'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:3.0.2'

    // Persistence
    implementation 'jakarta.persistence:jakarta.persistence-api'

    // Database Drivers
    implementation 'com.h2database:h2:2.4.240'
    implementation 'org.postgresql:postgresql:42.7.10'

    // Lombok
    testCompileOnly 'org.projectlombok:lombok:1.18.44'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.44'

    // Spring Boot Tests
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.spockframework:spock-spring:2.4-groovy-5.0'

    // Tech Easy Solutions
    testImplementation 'dk.sunepoulsen.tes-foundation:tes-data-generators:3.0.0-SNAPSHOT'
    testImplementation project(':tes-features-data-generators')
}

jib {
    from {
        image = "${project.property('backend.module.base.image.name')}:${project.property('backend.module.base.image.tag')}"
    }
    to {
        image = project.property('service.docker.image.name').toString()
        tags = [project.property('version').toString()]
    }

    container {
        mainClass = 'dk.sunepoulsen.tes.features.service.Application'
        jvmFlags = [
            '-Dcom.sun.management.jmxremote',
            '-Dcom.sun.management.jmxremote.port=9010',
            '-Dcom.sun.management.jmxremote.local.only=false',
            '-Dcom.sun.management.jmxremote.authenticate=false',
            '-Dcom.sun.management.jmxremote.ssl=false'
        ]
        ports = ['8443', '9010']
    }
}

javadoc {
    options.memberLevel = JavadocMemberLevel.PRIVATE
}

tasks.build.dependsOn tasks.jibDockerBuild
