# ===================================================================
#                   Logging configuration
# ===================================================================

logging:
  level:
    org.springframework: INFO
    org.springframework.boot: INFO
    org.springframework.security: INFO
    org.testcontainers: INFO
    com.zaxxer.hikari: INFO
    org.apache.velocity: INFO
    com.github.dockerjava.zerodep: INFO
    org.hibernate: WARN
    dk.sunepoulsen.tes: DEBUG
  file:
    name: @projectBuildDir@/logs/@projectName@.log

# ===================================================================
#                   Actuator configuration
# ===================================================================

management:
  endpoints:
    web:
      exposure:
        include: health,info,env,metrics
  endpoint:
    health:
      show-details: ALWAYS
    env:
      show-values: ALWAYS
  health:
    db:
      enabled: true

# ===================================================================
#                   SSL configuration
# ===================================================================

server:
  port: 19080
  ssl:
    enabled: false

# ===================================================================
#                   Spring JPA Configuration
# ===================================================================

spring:
  jpa:
    show-sql: true
  datasource:
    url: jdbc:h2:file:./tes-features-service/build/test-data/test-db;INIT=CREATE SCHEMA IF NOT EXISTS features;DB_CLOSE_DELAY=-1
    username: sa
    password: sa
    driver-class-name: org.h2.Driver
