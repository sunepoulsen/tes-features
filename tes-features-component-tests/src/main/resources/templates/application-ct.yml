# ===================================================================
#                   Logging configuration
# ===================================================================

logging:
  level:
    dk.sunepoulsen.tes: DEBUG
    org.springframework.security: DEBUG
  file:
    name: $serviceLogFile

# ===================================================================
#                   Actuator configuration
# ===================================================================

management:
  endpoints:
    web:
      exposure:
        include: health,info,env,metrics
  endpoint:
    env:
      show-values: ALWAYS
  health:
    db:
      enabled: true

# ===================================================================
#                   SSL configuration
# ===================================================================

server:
  ssl:
    enabled: true

    # The path to the keystore containing the certificate
    key-store: $certificateFile

    # The password used to generate the certificate
    key-store-password: '$certificatePassword'

# ===================================================================
#                   Spring JPA Configuration
# ===================================================================

spring:
  liquibase:
    user: $databaseAdminUser.username
    password: '$databaseAdminUser.password'
  jpa:
    show-sql: true
  datasource:
    url: jdbc:postgresql://$databaseHost:5432/$databaseName
    username: $databaseApplicationUser.username
    password: '$databaseApplicationUser.password'
    driver-class-name: org.postgresql.Driver
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://wiremock:8080/keycloak/realms/tes-foundation

oauth2:
  security:
    keycloak:
      client-id: 'tes-foundation'
